# ──────────────────────────────────────────────────────────────
#  رُمّان | RUMMAN — بيئة تطوير محلية
#  الهدف: تشغيل قاعدة بيانات MySQL + واجهة إدارة بضغطة واحدة
#  التشغيل:  docker compose up -d
# ──────────────────────────────────────────────────────────────
services:
  mysql:
    image: mysql:8.4
    container_name: rumman-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rumman_root
      MYSQL_DATABASE: rumman_market
      MYSQL_USER: rumman
      MYSQL_PASSWORD: rumman_pass
      TZ: Africa/Cairo
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+02:00
    ports:
      - "3306:3306"
    volumes:
      - rumman_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-urumman", "-prumman_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: rumman-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  rumman_db:
